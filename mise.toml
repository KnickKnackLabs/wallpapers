# Mise configuration for wallpaper generator
# Tasks are auto-discovered from .mise/tasks/

[settings]
experimental = true
quiet = true
task_output = "interleave"
lockfile = true
aqua.registries = ["https://github.com/KnickKnackLabs/bats-core"]

[plugins]
shiv = "https://github.com/KnickKnackLabs/vfox-shiv"

[tools]
gum = "0.17.0"
jq = "1.8.1"
usage = "3.2.1"
"aqua:KnickKnackLabs/bats-core" = "1.14.0-kkl.3"
"aqua:shenwei356/rush" = "0.9.0"
bun = "1.3.13"
actionlint = "1.7.12"
shellcheck = "0.11.0"
"shiv:codebase" = "0.4"
"shiv:readme" = "0.3"

[_.codebase]
name = "wallpapers"
lint = ["@all"]

# Note: Swift is built-in on macOS, no need to manage it
